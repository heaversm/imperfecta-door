<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperfecta</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Two layered images so we can crossfade between them. */
  #stage img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;   /* fill the whole screen (crops a sliver if aspect differs) — no black bars */
    opacity: 0;
    transition: opacity 600ms ease-in-out;
  }
  #stage img.visible { opacity: 1; }
  /* Live camera mirror — interspersed into the idle loop so approaching visitors see
     themselves and realize it's a camera. Mirrored like a selfie; sits above the stills. */
  #live {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
    opacity: 0; transition: opacity 600ms ease-in-out; z-index: 5; background: #000;
  }
  #live.visible { opacity: 1; }
  /* Ken Burns — a slow scale + drift on each still during its dwell. Pure CSS transform
     on the already-rendered image (zero extra server render), composited by the Pi. A few
     variants cycled per slide so it's not always the same move. transform-origin centers it. */
  #stage img { transform-origin: center; }
  @keyframes kb1 { from { transform: scale(1.00) translate(0,0);     } to { transform: scale(1.06) translate(-2%,-2%); } }
  @keyframes kb2 { from { transform: scale(1.00) translate(0,0);     } to { transform: scale(1.06) translate( 2%, 2%); } }
  @keyframes kb3 { from { transform: scale(1.05) translate( 1%,-1%); } to { transform: scale(1.00) translate( 0,  0);  } }
  #stage img.kb1 { animation: kb1 5s ease-out forwards; }
  #stage img.kb2 { animation: kb2 5s ease-out forwards; }
  #stage img.kb3 { animation: kb3 5s ease-out forwards; }
  /* Slitscan sweep — the slitscan smears along the vertical (time) axis, so a slow vertical
     glide reads as the slit traveling through time. Pure CSS = perfectly smooth (no jerky
     frame playback). Extra scale gives overscan so the translate never reveals an edge. */
  @keyframes kbsweep { from { transform: scale(1.14) translateY(-7%); } to { transform: scale(1.14) translateY(7%); } }
  #stage img.kbsweep { animation: kbsweep 5s ease-in-out forwards; }
  /* Optional status dot for debugging — hidden by default. */
  #status {
    position: fixed;
    bottom: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    transition: background 200ms;
    opacity: 0.5;
  }
  #status.live { background: #2a2; }
  /* Camera-flash overlay — double strobe fired the instant the trigger lands. */
  #flash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 50;
  }
  @keyframes camflash {
    0%   { opacity: 0; }
    6%   { opacity: 1; }   /* quick snap to full white (~70ms) */
    100% { opacity: 0; }   /* slow fade over the remaining ~1.1s */
  }
  #flash.fire { animation: camflash 1200ms ease-out; }
  /* Faster flash punctuating each effect-to-effect transition. */
  @keyframes camflashfast {
    0%   { opacity: 0; }
    12%  { opacity: 0.9; }   /* quick snap (~50ms) */
    100% { opacity: 0; }     /* fade over the rest (~350ms total) */
  }
  #flash.fire-fast { animation: camflashfast 400ms ease-out; }
  /* Oblique Strategies prompt card — full-screen white with black text, shown as the
     divider that caps each loop of the effects. Clean sans-serif, large and centered. */
  #card {
    position: fixed; inset: 0; z-index: 20;
    background: #fff; color: #000;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8vw;
    font-family: "Helvetica Neue", "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 60px);
    line-height: 1.15; letter-spacing: -0.01em;
    opacity: 0; pointer-events: none;
    transition: opacity 600ms ease-in-out;
  }
  #card.visible { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <img id="a" alt="">
  <img id="b" alt="">
  <video id="live" autoplay playsinline muted></video>
</div>
<div id="card"></div>
<div id="status"></div>
<div id="flash"></div>

<script>
const a = document.getElementById('a');
const b = document.getElementById('b');
const status = document.getElementById('status');
const flash = document.getElementById('flash');
const card = document.getElementById('card');
const live = document.getElementById('live');
let front = a, back = b;

const SLIDE_MS = 4000;     // dwell per still
const FADE_MS = 600;       // matches the CSS opacity transition
const FLIP_FPS = 6;        // flipbook playback rate
const FLIP_LOOPS = 1;      // ping-pong passes before advancing
const CARD_MS = 5000;      // dwell on each prompt card (long enough to read)
const LIVE_MS = 5000;      // dwell on the live mirror segment
const LIVE_EVERY = 3;      // show the live mirror after this many stills
const QUOTE_EVERY = 3;     // show an Oblique Strategy card after this many effects (also
                           // breaks up repetition while a fresh playlist is still assembling)

// Curated Oblique Strategies (Brian Eno & Peter Schmidt) — the universal, reaction-
// provoking lines; studio-specific ones are dropped. Shown one per loop.
const STRATEGIES = [
  "Honor thy error as a hidden intention",
  "Ask your body",
  "Trust in the you of now",
  "Breathe more deeply",
  "Take a break",
  "What would your closest friend do?",
  "Emphasise the flaws",
  "Be less critical more often",
  "Look closely at the most embarrassing details and amplify them",
  "Use an old idea",
  "Reverse",
  "Turn it upside down",
  "Do something boring",
  "Courage!",
  "Disconnect from desire",
  "Give way to your worst impulse",
  "What are you really thinking about just now?",
  "Listen to the quiet voice",
  "Faced with a choice, do both",
  "Repetition is a form of change",
  "Discard an axiom",
  "Remember those quiet evenings",
  "Don't be afraid of things because they're easy to do",
  "Accept advice",
  "Is it finished?",
  "Do nothing for as long as possible",
  "Twist the spine",
  "Decorate, decorate",
  "Be dirty",
  "Water",
  "Ghost echoes",
  "Simple subtraction",
  "Tidy up",
  "Make a blank valuable by putting it in an exquisite frame",
  "Go slowly all the way round the outside",
  "Look at a very small object; look at its centre",
  "Abandon normal instructions",
  "Change nothing and continue with immaculate consistency",
  "Humanise something free of error",
  "What wouldn't you do?",
  "Use your own ideas",
  "Don't break the silence",
  "Take away the elements in order of apparent non-importance",
  "State the problem as clearly as possible",
  "Where is the edge?",
  "Don't be frightened to display your talents",
  "Distort time",
  "Work at a different speed",
  "Question the heroic",
  "Look at the order in which you do things"
];
function randomStrategy() { return STRATEGIES[Math.floor(Math.random() * STRATEGIES.length)]; }

let active = [];           // playlist currently looping: [{kind:'still',url} | {kind:'flipbook',frames}]
let building = null;       // playlist being assembled from a new capture
let handedOver = false;    // has the building playlist taken over the live loop yet?
let idx = 0;
let everConnected = false;
let stillsSinceLive = 0;   // stills shown since the last live-mirror segment
let effectsSinceCard = 0;  // effects shown since the last interleaved quote card
let liveStream = null;     // getUserMedia stream while the mirror is active

function preload(urls) { urls.forEach(u => { const im = new Image(); im.src = u; }); }

let kbIdx = 0;             // cycles the Ken Burns variant per still

function doFlash(fast) {
  // Restart the CSS animation (remove → force reflow → re-add) so repeated fires re-trigger.
  // `fast` → the short punctuation between effects; default → the big trigger flash.
  flash.classList.remove('fire', 'fire-fast');
  void flash.offsetWidth;
  flash.classList.add(fast ? 'fire-fast' : 'fire');
}

function showCard(text) {
  // Full-screen white prompt card. The opaque card layer fades over the imagery;
  // showStill/playFlipbook fade it back out when the next effect comes up.
  card.textContent = text;
  card.classList.add('visible');
}

// ── Live camera mirror ──────────────────────────────────────────────
// The C920 allows one consumer at a time; effects_server grabs it (ffmpeg) on each
// ring. So we hold the camera only while the mirror is on screen, and release it the
// instant a ring lands (the 'flash' event) — effects_server waits a beat before its
// grab so the release wins the race. Reacquired next time the mirror comes up.
async function startLive() {
  if (liveStream) return true;
  try {
    liveStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 360, facingMode: 'user' }, audio: false,
    });
    live.srcObject = liveStream;
    return true;
  } catch (e) {
    console.warn('live camera unavailable:', e);
    liveStream = null;
    return false;
  }
}
function stopLive() {
  if (liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
  live.srcObject = null;
  live.classList.remove('visible');
}
async function showLive() {
  if (!(await startLive())) return false;
  card.classList.remove('visible');
  live.classList.add('visible');
  await new Promise(r => setTimeout(r, LIVE_MS));
  live.classList.remove('visible');
  await new Promise(r => setTimeout(r, FADE_MS));
  return true;
}

const KB_CLASSES = ['kb1', 'kb2', 'kb3', 'kbsweep'];

function showStill(url, kb = '') {
  // Preload into the back layer, then crossfade. `kb` is the motion class to apply
  // ('' = dead-still, used for the instant first photo; 'kbsweep' = slitscan vertical glide;
  // otherwise a cycled Ken Burns variant). All motion is pure CSS transform → smooth.
  back.onload = () => {
    card.classList.remove('visible');             // fade the prompt card out as the still fades in
    back.classList.remove(...KB_CLASSES);
    if (kb) {
      void back.offsetWidth;                        // reflow so the animation restarts
      back.classList.add(kb);
    }
    back.classList.add('visible');
    front.classList.remove('visible');
    [front, back] = [back, front];   // swap roles for the next fade
  };
  back.onerror = () => console.warn('image load failed:', url);
  back.src = url;
}

async function playFlipbook(frames) {
  // Ping-pong through the raw burst frames on the front layer → they watch themselves move.
  // Clear any Ken Burns transform so the motion clip plays clean (not scaled/drifting).
  front.classList.remove(...KB_CLASSES);
  card.classList.remove('visible');               // fade the prompt card out as the clip starts
  back.classList.remove('visible');
  const seq = frames.concat(frames.slice(1, -1).reverse());
  const order = [].concat(...Array(FLIP_LOOPS).fill(seq));
  for (const url of order) {
    front.src = url;
    front.classList.add('visible');
    await new Promise(r => setTimeout(r, 1000 / FLIP_FPS));
  }
}

async function step() {
  // Nothing rendered yet (fresh boot, no ring) — loop the live mirror so people walking
  // up see themselves instead of a black screen.
  if (!active.length) {
    const shown = await showLive();
    setTimeout(step, shown ? 200 : 500);
    return;
  }
  // Intersperse the live mirror every LIVE_EVERY stills so approaching visitors realize
  // it's a camera (rather than only seeing the previous visitor's photos).
  if (stillsSinceLive >= LIVE_EVERY) {
    stillsSinceLive = 0;
    if (await showLive()) { setTimeout(step, 200); return; }
  }
  // Interleave an Oblique Strategy card between effects (every QUOTE_EVERY). This also
  // fills the loop while a fresh playlist is still assembling, so the same 1-2 ready
  // effects aren't shown back-to-back. The card sits BETWEEN effects — it doesn't skip one.
  if (effectsSinceCard >= QUOTE_EVERY) {
    effectsSinceCard = 0;
    doFlash(true);
    showCard(randomStrategy());
    setTimeout(step, CARD_MS + FADE_MS);
    return;
  }
  const item = active[idx % active.length];
  idx++;
  doFlash(true);   // quick flash punctuating every effect-to-effect transition
  if (item.kind === 'card') {
    showCard(randomStrategy());
    setTimeout(step, CARD_MS + FADE_MS);
  } else if (item.kind === 'flipbook' || item.kind === 'clip') {
    effectsSinceCard++;
    await playFlipbook(item.frames);
    setTimeout(step, 200);
  } else {
    // Slitscan smears along the time axis → give it the smooth vertical sweep; everything
    // else gets a cycled Ken Burns drift.
    const kb = /slit/i.test(item.name || '') ? 'kbsweep' : ('kb' + (kbIdx++ % 3 + 1));
    showStill(item.url, kb);
    stillsSinceLive++;
    effectsSinceCard++;
    setTimeout(step, SLIDE_MS + FADE_MS);
  }
}

async function bootstrap() {
  // After a reload (self-heal or kiosk relaunch), rebuild the last playlist from the
  // render outputs still on disk so we don't sit black until the next ring.
  const items = [];
  for (let i = 0; i < 32; i++) {
    const url = `/latest_${i}.jpg?t=${Date.now()}`;
    const ok = await fetch(url, { method: 'HEAD', cache: 'no-store' }).then(r => r.ok).catch(() => false);
    if (!ok) break;
    items.push({ kind: 'still', url });
  }
  if (items.length && !active.length) { items.push({ kind: 'card' }); active = items; idx = 0; }
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { everConnected = true; status.classList.add('live'); };
  es.onerror = () => {
    status.classList.remove('live');
    // CONNECTING (0): auto-reconnecting, leave it. CLOSED (2): gave up — reload to recover.
    if (es.readyState === EventSource.CLOSED) setTimeout(() => location.reload(), 3000);
  };
  es.addEventListener('reload', () => location.reload());   // deploy.sh nudges new viewer.html live without a reboot
  es.addEventListener('goto', (e) => { location.href = JSON.parse(e.data).url; });   // flip kiosk to /shader etc.
  es.addEventListener('flash', () => { stopLive(); doFlash(false); });   // release the camera for the capture + big flash
  es.addEventListener('first', (e) => {
    // Instant static first photo — show it immediately, no motion, until the loop hands over.
    showStill(JSON.parse(e.data).url, '');
  });
  es.addEventListener('playlist-start', (e) => {
    const d = JSON.parse(e.data);
    building = [];   // start assembling a new playlist; keep looping the current one
    handedOver = false;
    if (d.flipbook && d.flipbook.length) {
      preload(d.flipbook);
      building.push({ kind: 'flipbook', frames: d.flipbook });
    }
  });
  es.addEventListener('append', (e) => {
    const d = JSON.parse(e.data);
    if (!building) building = [];
    if (d.kind === 'clip') {
      preload(d.frames);
      building.push({ kind: 'clip', frames: d.frames });
    } else {
      preload([d.url]);
      building.push({ kind: 'still', url: d.url, name: d.name });
    }
    // Hand over to the new playlist ONCE (the first time we have ≥2 items). After this,
    // active and building are the same array, so later appends just extend the live loop —
    // we must NOT reset idx again or the loop keeps snapping back to item 0 (the flipbook)
    // every time another effect finishes rendering.
    if (!handedOver && building.length >= 2) { active = building; idx = 0; handedOver = true; }
  });
  es.addEventListener('playlist-end', () => {
    // Finalize the playlist. Quote cards are now interleaved live in step() (every
    // QUOTE_EVERY effects), so we no longer append a single card here.
    if (!building) return;
    active = building;
  });
}

connect();
bootstrap().then(step);

// Self-heal watchdog: if the live connection never establishes within 20s, the page
// loaded in a bad state — reload to recover (cold-boot race protection).
setTimeout(() => { if (!everConnected) location.reload(); }, 20000);
</script>
</body>
</html>
