<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperfecta</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Two layered images so we can crossfade between them. */
  #stage img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;   /* fill the whole screen (crops a sliver if aspect differs) — no black bars */
    opacity: 0;
    transition: opacity 600ms ease-in-out;
  }
  #stage img.visible { opacity: 1; }
  /* Optional status dot for debugging — hidden by default. */
  #status {
    position: fixed;
    bottom: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    transition: background 200ms;
    opacity: 0.5;
  }
  #status.live { background: #2a2; }
  /* Camera-flash overlay — double strobe fired the instant the trigger lands. */
  #flash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 50;
  }
  @keyframes doubleflash {
    0%, 100% { opacity: 0; }
    4%  { opacity: 1; }
    18% { opacity: 0; }
    34% { opacity: 1; }
    48% { opacity: 0; }
  }
  #flash.fire { animation: doubleflash 600ms ease-out; }
</style>
</head>
<body>
<div id="stage">
  <img id="a" alt="">
  <img id="b" alt="">
</div>
<div id="status"></div>
<div id="flash"></div>

<script>
const a = document.getElementById('a');
const b = document.getElementById('b');
const status = document.getElementById('status');
const flash = document.getElementById('flash');
let front = a, back = b;

const SLIDE_MS = 4000;     // dwell per still
const FADE_MS = 600;       // matches the CSS opacity transition
const FLIP_FPS = 6;        // flipbook playback rate
const FLIP_LOOPS = 1;      // ping-pong passes before advancing

let active = [];           // playlist currently looping: [{kind:'still',url} | {kind:'flipbook',frames}]
let building = null;       // playlist being assembled from a new capture
let idx = 0;
let everConnected = false;

function preload(urls) { urls.forEach(u => { const im = new Image(); im.src = u; }); }

function doFlash() {
  // Restart the CSS animation (remove → force reflow → re-add) so repeated triggers re-fire.
  flash.classList.remove('fire');
  void flash.offsetWidth;
  flash.classList.add('fire');
}

function showStill(url) {
  // Preload into the back layer, then crossfade.
  back.onload = () => {
    back.classList.add('visible');
    front.classList.remove('visible');
    [front, back] = [back, front];   // swap roles for the next fade
  };
  back.onerror = () => console.warn('image load failed:', url);
  back.src = url;
}

async function playFlipbook(frames) {
  // Ping-pong through the raw burst frames on the front layer → they watch themselves move.
  back.classList.remove('visible');
  const seq = frames.concat(frames.slice(1, -1).reverse());
  const order = [].concat(...Array(FLIP_LOOPS).fill(seq));
  for (const url of order) {
    front.src = url;
    front.classList.add('visible');
    await new Promise(r => setTimeout(r, 1000 / FLIP_FPS));
  }
}

async function step() {
  if (!active.length) { setTimeout(step, 500); return; }   // nothing yet — wait for a ring
  const item = active[idx % active.length];
  idx++;
  if (item.kind === 'flipbook' || item.kind === 'clip') {
    await playFlipbook(item.frames);
    setTimeout(step, 200);
  } else {
    showStill(item.url);
    setTimeout(step, SLIDE_MS + FADE_MS);
  }
}

async function bootstrap() {
  // After a reload (self-heal or kiosk relaunch), rebuild the last playlist from the
  // render outputs still on disk so we don't sit black until the next ring.
  const items = [];
  for (let i = 0; i < 32; i++) {
    const url = `/latest_${i}.jpg?t=${Date.now()}`;
    const ok = await fetch(url, { method: 'HEAD', cache: 'no-store' }).then(r => r.ok).catch(() => false);
    if (!ok) break;
    items.push({ kind: 'still', url });
  }
  if (items.length && !active.length) { active = items; idx = 0; }
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { everConnected = true; status.classList.add('live'); };
  es.onerror = () => {
    status.classList.remove('live');
    // CONNECTING (0): auto-reconnecting, leave it. CLOSED (2): gave up — reload to recover.
    if (es.readyState === EventSource.CLOSED) setTimeout(() => location.reload(), 3000);
  };
  es.addEventListener('flash', doFlash);   // instant double-strobe on trigger
  es.addEventListener('playlist-start', (e) => {
    const d = JSON.parse(e.data);
    building = [];   // start assembling a new playlist; keep looping the current one
    if (d.flipbook && d.flipbook.length) {
      preload(d.flipbook);
      building.push({ kind: 'flipbook', frames: d.flipbook });
    }
  });
  es.addEventListener('append', (e) => {
    const d = JSON.parse(e.data);
    if (!building) building = [];
    if (d.kind === 'clip') {
      preload(d.frames);
      building.push({ kind: 'clip', frames: d.frames });
    } else {
      preload([d.url]);
      building.push({ kind: 'still', url: d.url });
    }
    if (building.length >= 2) { active = building; idx = 0; }   // hand over — no black gap
  });
}

connect();
bootstrap().then(step);

// Self-heal watchdog: if the live connection never establishes within 20s, the page
// loaded in a bad state — reload to recover (cold-boot race protection).
setTimeout(() => { if (!everConnected) location.reload(); }, 20000);
</script>
</body>
</html>
