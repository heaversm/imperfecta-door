<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Face Collector</title>
		<style>
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}

			html,
			body {
				margin: 0;
				overflow-x: hidden; /* the collage bleeds past the viewport edges */
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					Helvetica, Arial, sans-serif;
				color: #fff;
				background: #000;
				user-select: none;
			}

			#stage {
				max-width: 800px;
				margin: 0 auto;
			}

			/* ---------- hero: the live camera, top center ---------- */
			#hero {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 20px;
				margin-bottom: 36px;
			}
			#camwrap {
				position: relative;
			}
			#cam {
				display: block;
				width: 100%;
				aspect-ratio: 16 / 9;
				object-fit: cover;
				transform: scaleX(-1); /* mirror like a selfie */
				background: #000;
				/* ease back in after the dissolve ends */
				transition: opacity 0.9s ease;
			}
			/* frozen snapshot shown over the live video while a ring uploads */
			#freeze {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: none;
			}
			#camwrap.busy #freeze {
				display: block;
			}
			/* particle canvas: the frozen frame dissolving upward while it loads */
			#fx {
				position: absolute;
				left: 0;
				width: 100%;
				bottom: 0;
				height: 200%; /* extends above the frame so pixels fly past the top */
				pointer-events: none;
				display: none;
			}
			#camwrap.fx #fx {
				display: block;
			}
			/* during the fx the particles ARE the image — no photo behind,
			   just the live video pulled way down */
			#camwrap.fx #freeze {
				display: none;
			}
			#camwrap.fx #cam {
				opacity: 0; /* pure black behind the particles — once a pixel
				               leaves, nothing remains where it was */
				transition: none; /* vanish instantly at ring time */
			}
			/* thin white spinner over the camera while a capture processes
			   (fallback only — hidden when the WebGL particle effect runs) */
			#camwrap.fx::after {
				display: none;
			}
			#camwrap.busy::after {
				content: '';
				position: absolute;
				top: 50%;
				left: 50%;
				width: 48px;
				height: 48px;
				margin: -24px 0 0 -24px;
				border: 2px solid rgba(255, 255, 255, 0.25);
				border-top-color: #fff;
				border-radius: 50%;
				animation: spin 0.9s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			#capture {
				position: fixed;
				bottom: 10px;
				right: 10px;
				appearance: none;
				border: 1px solid #fff;
				cursor: pointer;
				font-size: 18px;
				font-weight: 600;
				color: #000;
				padding: 18px 44px;
				background: #fff;
				transition:
					transform 0.12s ease,
					opacity 0.2s ease;
				z-index: 1000;
			}
			#capture:active {
				transform: scale(0.95);
			}
			#capture:disabled {
				opacity: 0.4;
				cursor: default;
			}

			/* ---------- grid: the collection, overlapping collage ---------- */
			#grid {
				display: grid;
				/* tracks narrower than the faces (~90-130px wide) so neighbors
				   genuinely overlap horizontally */
				grid-template-columns: repeat(auto-fill, 104px);
				justify-content: center;
				align-items: end;
				margin-top: -60px;
				/* full-bleed: escape the 800px stage and hang a bit past the
				   viewport so edge faces run off-screen instead of stopping */
				width: calc(100vw + 80px);
				margin-left: calc(50% - 50vw - 40px);
			}
			#grid .cell {
				display: flex;
				align-items: flex-end;
				justify-content: center;
				height: 118px;
				margin: -18px 0;
			}
			#grid img {
				max-width: none;
				width: auto;
			}

			/* pop-in for a brand-new face */
			.pop {
				animation: pop 0.7s cubic-bezier(0.18, 0.9, 0.22, 1.2) both;
			}
			@keyframes pop {
				0% {
					scale: 0.3;
					opacity: 0;
				}
				100% {
					scale: 1;
					opacity: 1;
				}
			}

			/* capture flash */
			#flash {
				position: fixed;
				inset: 0;
				background: #fff;
				opacity: 0;
				pointer-events: none;
				z-index: 999;
			}
			#flash.go {
				animation: flash 0.25s ease-out;
			}
			@keyframes flash {
				from {
					opacity: 0.9;
				}
				to {
					opacity: 0;
				}
			}

			canvas {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="stage">
			<section id="hero">
				<div id="camwrap">
					<video id="cam" autoplay playsinline muted></video>
					<img id="freeze" alt="" />
					<canvas id="fx"></canvas>
				</div>
				<button id="capture">Ring Doorbell</button>
			</section>
			<section id="grid"></section>
		</div>

		<div id="flash"></div>
		<canvas id="canvas"></canvas>

		<script>
			const els = {
				grid: document.getElementById('grid'),
				cam: document.getElementById('cam'),
				freeze: document.getElementById('freeze'),
				camwrap: document.getElementById('camwrap'),
				capture: document.getElementById('capture'),
				flash: document.getElementById('flash'),
				canvas: document.getElementById('canvas'),
			}

			let heads = [] // newest first
			let busy = false
			let newestId = null // id to pop-animate when it enters the grid
			let feedKey = '' // fingerprint of the rendered feed, to skip no-op re-renders

			// ---- webcam ----
			async function initCam() {
				try {
					const stream = await navigator.mediaDevices.getUserMedia({
						video: { facingMode: 'user', width: 1280, height: 720 },
						audio: false,
					})
					els.cam.srcObject = stream
				} catch (err) {
					console.error('camera error', err)
					els.capture.textContent = 'Camera blocked'
					els.capture.disabled = true
				}
			}

			// Grab a JPEG from the live feed, downscaled for fast upload + removal.
			function snapshot() {
				const v = els.cam
				const vw = v.videoWidth || 1280
				const vh = v.videoHeight || 720
				const target = 720 // output width
				const scale = target / vw
				const c = els.canvas
				c.width = target
				c.height = Math.round(vh * scale)
				const ctx = c.getContext('2d')
				// mirror to match the preview
				ctx.translate(c.width, 0)
				ctx.scale(-1, 1)
				ctx.drawImage(v, 0, 0, c.width, c.height)
				return c.toDataURL('image/jpeg', 0.9)
			}

			// ---- rendering ----
			function render() {
				els.grid.innerHTML = ''
				// size/offset derived from the id so each face keeps its exact look
				// across re-renders; z stacks in feed order
				heads.forEach((h, i) => {
					let hash = 0
					for (const ch of h.id)
						hash = (hash * 31 + ch.charCodeAt(0)) | 0
					hash = Math.abs(hash)
					const dx = ((hash >> 3) % 37) - 18 // -18..18px
					const dy = ((hash >> 7) % 29) - 14 // -14..14px
					const rot = ((hash >> 11) % 29) - 14 // -14..14deg
					const scl = 0.95 + ((hash >> 13) % 11) / 100 // 0.95..1.05
					const cell = document.createElement('div')
					cell.className = 'cell'
					cell.style.zIndex = i
					cell.innerHTML =
						'<img src="' +
						h.cutoutUrl +
						'" alt="" style="max-height:120px; transform: translate(' +
						dx +
						'px,' +
						dy +
						'px) rotate(' +
						rot +
						'deg) scale(' +
						scl +
						')" />'
					if (h.id === newestId) {
						cell.querySelector('img').classList.add('pop')
						newestId = null
					}
					els.grid.appendChild(cell)
				})
			}

			// ---- data ----
			// Only touch the DOM when the feed actually changed — pointless
			// rebuilds make the page flicker.
			function applyFeed(data) {
				const key = data.map((h) => h.id).join()
				if (key === feedKey) return
				feedKey = key
				heads = data
				render()
			}

			// Live updates are pushed over a WebSocket by the server (full feed on
			// connect and after every capture). No polling.
			function connect() {
				const ws = new WebSocket(
					(location.protocol === 'https:' ? 'wss://' : 'ws://') +
						location.host +
						'/ws',
				)
				ws.onmessage = (e) => {
					try {
						const msg = JSON.parse(e.data)
						if (msg.type === 'feed' && Array.isArray(msg.heads)) {
							applyFeed(msg.heads)
						} else if (msg.type === 'ring') {
							// Real doorbell rang — same path as the on-screen button.
							// Dormant in the tablet demo (no ring messages arrive there).
							capture()
						}
					} catch (err) {
						console.error('ws message', err)
					}
				}
				ws.onclose = () =>
					setTimeout(connect, 2000 + Math.random() * 2000)
			}

			// One-time fallback in case the WebSocket can't connect.
			async function loadHeads() {
				try {
					const res = await fetch('/api/heads', { cache: 'no-store' })
					if (!res.ok) return
					const data = await res.json()
					if (Array.isArray(data) && !feedKey) applyFeed(data)
				} catch (err) {
					console.error('loadHeads', err)
				}
			}

			// ---- loader fx: the frozen frame dissolves into pixels that flow
			// up and funnel toward top center. All motion lives in the vertex
			// shader (position is a pure function of time), so the CPU does
			// nothing per frame — smooth even on a Raspberry Pi.
			const fx = (() => {
				const canvas = document.getElementById('fx')
				const gl = canvas.getContext('webgl', {
					alpha: true,
					premultipliedAlpha: false,
				})
				if (!gl) return null

				const vsrc = `
					attribute vec2 a_origin;   // image uv, y down
					attribute vec3 a_color;
					attribute float a_seed;    // 0..1
					uniform float u_time;
					uniform float u_point;
					varying vec3 v_color;
					varying float v_alpha;
					void main() {
						v_color = a_color;
						// ONE-SHOT dissolve: every pixel starts in place (the
						// assembled photo), then rows peel off top-to-bottom,
						// each pixel flying from its own position into the
						// slurp point at center-top.
						float delay = a_origin.y * 2.4 + a_seed * 0.45;
						float travel = 1.2 + a_seed * 0.5;
						float phase = clamp((u_time - delay) / travel, 0.0, 1.0);
						float t = phase * phase * (3.0 - 2.0 * phase);
						t = pow(t, 1.5); // linger, then accelerate — slurp
						// the frame occupies the bottom half of the canvas
						// (uv y 0..1 -> canvas y 0.5..1)
						vec2 start = vec2(a_origin.x, 0.5 + a_origin.y * 0.5);
						vec2 target = vec2(0.5, 0.0);
						// curved path: control point bows sideways per particle
						vec2 ctrl = vec2(
							mix(start.x, target.x, 0.55) + (a_seed - 0.5) * 0.25,
							mix(start.y, target.y, 0.55)
						);
						vec2 pos = mix(mix(start, ctrl, t), mix(ctrl, target, t), t);
						// stay visible almost all the way into the point
						v_alpha = 1.0 - smoothstep(0.93, 1.0, t);
						gl_Position = vec4(pos.x * 2.0 - 1.0, 1.0 - pos.y * 2.0, 0.0, 1.0);
						gl_PointSize = u_point * (1.0 - 0.7 * t);
					}`
				const fsrc = `
					precision mediump float;
					varying vec3 v_color;
					varying float v_alpha;
					void main() {
						gl_FragColor = vec4(v_color, v_alpha);
					}`
				const mk = (type, src) => {
					const s = gl.createShader(type)
					gl.shaderSource(s, src)
					gl.compileShader(s)
					return s
				}
				const prog = gl.createProgram()
				gl.attachShader(prog, mk(gl.VERTEX_SHADER, vsrc))
				gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, fsrc))
				gl.linkProgram(prog)
				if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null
				gl.useProgram(prog)
				gl.enable(gl.BLEND)
				gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)

				const loc = {
					origin: gl.getAttribLocation(prog, 'a_origin'),
					color: gl.getAttribLocation(prog, 'a_color'),
					seed: gl.getAttribLocation(prog, 'a_seed'),
					time: gl.getUniformLocation(prog, 'u_time'),
					point: gl.getUniformLocation(prog, 'u_point'),
				}
				const buf = gl.createBuffer()
				let count = 0
				let raf = 0

				// sample the snapshot canvas into a particle per pixel block
				function load(srcCanvas) {
					const GRID = 420 // particles across (~99k total — real pixels)
					const gh = Math.round(
						(GRID * srcCanvas.height) / srcCanvas.width,
					)
					const ctx = srcCanvas.getContext('2d')
					const img = ctx.getImageData(
						0,
						0,
						srcCanvas.width,
						srcCanvas.height,
					).data
					const stride = 6 // origin xy, rgb, seed
					const data = new Float32Array(GRID * gh * stride)
					let n = 0
					for (let y = 0; y < gh; y++) {
						for (let x = 0; x < GRID; x++) {
							const px = Math.floor(((x + 0.5) / GRID) * srcCanvas.width)
							const py = Math.floor(((y + 0.5) / gh) * srcCanvas.height)
							const o = (py * srcCanvas.width + px) * 4
							const d = n * stride
							data[d] = (x + 0.5) / GRID
							data[d + 1] = (y + 0.5) / gh
							data[d + 2] = img[o] / 255
							data[d + 3] = img[o + 1] / 255
							data[d + 4] = img[o + 2] / 255
							data[d + 5] = Math.random()
							n++
						}
					}
					count = n
					gl.bindBuffer(gl.ARRAY_BUFFER, buf)
					gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW)
					const F = 4
					gl.vertexAttribPointer(loc.origin, 2, gl.FLOAT, false, stride * F, 0)
					gl.vertexAttribPointer(loc.color, 3, gl.FLOAT, false, stride * F, 2 * F)
					gl.vertexAttribPointer(loc.seed, 1, gl.FLOAT, false, stride * F, 5 * F)
					gl.enableVertexAttribArray(loc.origin)
					gl.enableVertexAttribArray(loc.color)
					gl.enableVertexAttribArray(loc.seed)
					return GRID
				}

				// full dissolve: max row delay + max travel time (see shader)
				const DURATION = 4700
				let startedAt = 0

				return {
					// resolves once the one-shot dissolve has fully played out
					finished() {
						return new Promise((r) =>
							setTimeout(
								r,
								Math.max(0, startedAt + DURATION - performance.now()),
							),
						)
					},
					start(srcCanvas) {
						startedAt = performance.now()
						const grid = load(srcCanvas)
						const dpr = Math.min(window.devicePixelRatio || 1, 2)
						canvas.width = canvas.clientWidth * dpr
						canvas.height = canvas.clientHeight * dpr
						gl.viewport(0, 0, canvas.width, canvas.height)
						gl.uniform1f(loc.point, (canvas.width / grid) * 1.05)
						const t0 = performance.now()
						const tick = () => {
							gl.uniform1f(loc.time, (performance.now() - t0) / 1000)
							gl.clearColor(0, 0, 0, 0)
							gl.clear(gl.COLOR_BUFFER_BIT)
							gl.drawArrays(gl.POINTS, 0, count)
							raf = requestAnimationFrame(tick)
						}
						tick()
					},
					stop() {
						cancelAnimationFrame(raf)
						gl.clear(gl.COLOR_BUFFER_BIT)
					},
				}
			})()

			// ---- doorbell chime: two-tone ding-dong, synthesized ----
			function ding() {
				try {
					const ac = new (
						window.AudioContext || window.webkitAudioContext
					)()
					;[
						[659.25, 0],
						[523.25, 0.35],
					].forEach(([freq, at]) => {
						const osc = ac.createOscillator()
						const gain = ac.createGain()
						osc.type = 'sine'
						osc.frequency.value = freq
						gain.gain.setValueAtTime(0.35, ac.currentTime + at)
						gain.gain.exponentialRampToValueAtTime(
							0.001,
							ac.currentTime + at + 0.9,
						)
						osc.connect(gain).connect(ac.destination)
						osc.start(ac.currentTime + at)
						osc.stop(ac.currentTime + at + 1)
					})
				} catch {}
			}

			// ---- capture flow ----
			async function capture() {
				if (busy) return
				ding()
				const dataUrl = snapshot()

				// flash
				els.flash.classList.remove('go')
				void els.flash.offsetWidth
				els.flash.classList.add('go')

				busy = true
				els.capture.disabled = true
				els.capture.textContent = 'Ringing…'
				els.freeze.src = dataUrl // freeze the moment being uploaded
				els.camwrap.classList.add('busy')
				if (fx) {
					els.camwrap.classList.add('fx')
					fx.start(els.canvas) // dissolve the frozen frame into pixels
				}

				try {
					const res = await fetch('/api/capture', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ image: dataUrl }),
					})
					const entry = await res.json()
					if (res.ok && entry && entry.id) {
						newestId = entry.id
						// WS broadcast usually beats this; applyFeed dedupes either way
						applyFeed([
							entry,
							...heads.filter((h) => h.id !== entry.id),
						])
					}
				} catch (err) {
					console.error('capture', err)
				} finally {
					// let the dissolve play out fully before bringing the
					// live video back, even if the server finished first
					if (fx && els.camwrap.classList.contains('fx')) {
						await fx.finished()
					}
					busy = false
					els.capture.disabled = false
					els.capture.textContent = 'Ring Doorbell'
					els.camwrap.classList.remove('busy')
					els.camwrap.classList.remove('fx')
					if (fx) fx.stop()
				}
			}

			els.capture.addEventListener('click', capture)

			initCam()
			connect()
			loadHeads()
		</script>
	</body>
</html>
