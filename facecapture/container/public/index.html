<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Face Collector</title>
		<style>
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}

			:root {
				/* ONE knob for face size — grid tracks, row height, and image
				   height all scale from it. 120px is the original look. */
				--face: 200px;
			}

			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden; /* landscape kiosk: nothing scrolls */
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					Helvetica, Arial, sans-serif;
				color: #fff;
				background: #000;
				user-select: none;
			}

			/* the camera runs headless — snapshots only, never previewed */
			#cam {
				position: fixed;
				top: 0;
				left: 0;
				width: 2px;
				height: 2px;
				opacity: 0;
				pointer-events: none;
			}

			/* ---------- capture panel: left half, revealed when the feed
			   slides aside. Holds the frozen snapshot + spinner. ---------- */
			#capturepanel {
				position: fixed;
				top: 0;
				left: 0;
				width: 50%;
				height: 100%;
				background: #000;
				z-index: 1;
			}
			#shot {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}
			/* thin white spinner over the frozen frame while it uploads */
			body.busy #capturepanel::after {
				content: '';
				position: absolute;
				bottom: 24px;
				right: 24px;
				width: 48px;
				height: 48px;
				border: 2px solid rgba(255, 255, 255, 0.25);
				border-top-color: #fff;
				border-radius: 50%;
				animation: spin 0.9s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			/* "PLEASE HOLD" overlay, centered on top of the spinner */
			#hold {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				font-size: 42px;
				font-weight: 800;
				letter-spacing: 0.08em;
				white-space: nowrap;
				color: #fff;
				-webkit-text-stroke: 6px #000;
				paint-order: stroke fill;
				/* fallback outline for engines without paint-order on text */
				text-shadow:
					2px 2px 0 #000,
					-2px 2px 0 #000,
					2px -2px 0 #000,
					-2px -2px 0 #000;
				display: none;
			}
			body.busy #hold {
				display: block;
			}

			/* ---------- feed: the collage, full screen. Slides right to half
			   width while a capture uploads, then back. ---------- */
			#feed {
				position: fixed;
				inset: 0;
				background: #000;
				z-index: 10;
				overflow: hidden;
				display: flex; /* lets #grid center via margin:auto (overflow-safe) */
				transform: translateX(0);
				transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
			}
			body.busy #feed {
				transform: translateX(50%);
			}

			#grid {
				display: grid;
				/* tracks narrower than the faces so neighbors genuinely
				   overlap horizontally */
				grid-template-columns: repeat(
					auto-fill,
					calc(var(--face) * 0.87)
				);
				justify-content: center;
				align-items: end;
				/* vertically center when the collage fits, but top-align when
				   it overflows (auto margins collapse to 0 on overflow, unlike
				   align-content:center which clips the first rows) */
				margin: auto -40px;
				/* full-bleed: hang a bit past the edges so border faces run
				   off-screen instead of stopping */
				width: calc(100% + 80px);
				flex: none;
				/* keep the first/last rows' negative cell margins on-screen */
				padding: calc(var(--face) * 0.15) 0;
			}
			#grid .cell {
				display: flex;
				align-items: flex-end;
				justify-content: center;
				height: calc(var(--face) * 0.98);
				margin: calc(var(--face) * -0.15) 0; /* rows overlap vertically */
			}
			#grid img {
				max-width: none;
				width: auto;
				max-height: var(--face);
			}

			/* pop-in for a brand-new face */
			.pop {
				animation: pop 0.7s cubic-bezier(0.18, 0.9, 0.22, 1.2) both;
			}
			@keyframes pop {
				0% {
					scale: 0.3;
					opacity: 0;
				}
				100% {
					scale: 1;
					opacity: 1;
				}
			}

			#capture {
				position: fixed;
				bottom: 10px;
				right: 10px;
				appearance: none;
				border: 1px solid #fff;
				cursor: pointer;
				font-size: 18px;
				font-weight: 600;
				color: #000;
				padding: 18px 44px;
				background: #fff;
				transition:
					transform 0.12s ease,
					opacity 0.2s ease;
				z-index: 1000;
			}
			#capture:active {
				transform: scale(0.95);
			}
			#capture:disabled {
				opacity: 0.4;
				cursor: default;
			}

			/* capture flash */
			#flash {
				position: fixed;
				inset: 0;
				background: #fff;
				opacity: 0;
				pointer-events: none;
				z-index: 999;
			}
			#flash.go {
				animation: flash 0.25s ease-out;
			}
			@keyframes flash {
				from {
					opacity: 0.9;
				}
				to {
					opacity: 0;
				}
			}

			canvas {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="capturepanel">
			<img id="shot" alt="" />
			<div id="hold"></div>
		</div>
		<div id="feed">
			<section id="grid"></section>
		</div>

		<video id="cam" autoplay playsinline muted></video>
		<button id="capture">Ring Doorbell</button>
		<div id="flash"></div>
		<canvas id="canvas"></canvas>

		<script>
			const els = {
				grid: document.getElementById('grid'),
				hold: document.getElementById('hold'),
				cam: document.getElementById('cam'),
				shot: document.getElementById('shot'),
				capture: document.getElementById('capture'),
				flash: document.getElementById('flash'),
				canvas: document.getElementById('canvas'),
			}

			let heads = [] // newest first
			let busy = false
			let newestId = null // id to pop-animate when it enters the grid
			let feedKey = '' // fingerprint of the rendered feed, to skip no-op re-renders

			// how long the capture panel stays open at minimum, so the slide +
			// spinner read as a moment even when the upload is fast
			const MIN_OPEN_MS = 2000
			const delay = (ms) => new Promise((r) => setTimeout(r, ms))

			// ---- hold messages: one random pick per ring ----
			const HOLD_MSGS = [
				'PLEASE HOLD',
				'GRABBING SOUL',
				'CALLING HOME',
				'OH MY GOD',
				'ONE MOMENT',
			]
			function pickHoldMsg() {
				els.hold.textContent =
					HOLD_MSGS[Math.floor(Math.random() * HOLD_MSGS.length)]
			}

			// ---- webcam (headless: stream runs, but is never previewed) ----
			async function initCam() {
				try {
					const stream = await navigator.mediaDevices.getUserMedia({
						video: { facingMode: 'user', width: 1280, height: 720 },
						audio: false,
					})
					els.cam.srcObject = stream
				} catch (err) {
					console.error('camera error', err)
					els.capture.textContent = 'Camera blocked'
					els.capture.disabled = true
				}
			}

			// Grab a JPEG from the live feed, downscaled for fast upload + removal.
			function snapshot() {
				const v = els.cam
				const vw = v.videoWidth || 1280
				const vh = v.videoHeight || 720
				const target = 720 // output width
				const scale = target / vw
				const c = els.canvas
				c.width = target
				c.height = Math.round(vh * scale)
				const ctx = c.getContext('2d')
				// mirror like a selfie
				ctx.translate(c.width, 0)
				ctx.scale(-1, 1)
				ctx.drawImage(v, 0, 0, c.width, c.height)
				return c.toDataURL('image/jpeg', 0.9)
			}

			// ---- rendering ----
			function render() {
				els.grid.innerHTML = ''
				// size/offset derived from the id so each face keeps its exact look
				// across re-renders; z stacks in feed order
				heads.forEach((h, i) => {
					let hash = 0
					for (const ch of h.id)
						hash = (hash * 31 + ch.charCodeAt(0)) | 0
					hash = Math.abs(hash)
					const dx = ((hash >> 3) % 37) - 18 // -18..18px
					const dy = ((hash >> 7) % 29) - 14 // -14..14px
					const rot = ((hash >> 11) % 29) - 14 // -14..14deg
					const scl = 0.95 + ((hash >> 13) % 11) / 100 // 0.95..1.05
					const cell = document.createElement('div')
					cell.className = 'cell'
					cell.style.zIndex = i
					cell.innerHTML =
						'<img src="' +
						h.cutoutUrl +
						'" alt="" style="transform: translate(' +
						dx +
						'px,' +
						dy +
						'px) rotate(' +
						rot +
						'deg) scale(' +
						scl +
						')" />'
					if (h.id === newestId) {
						cell.querySelector('img').classList.add('pop')
						newestId = null
					}
					els.grid.appendChild(cell)
				})
			}

			// ---- data ----
			// Only touch the DOM when the feed actually changed — pointless
			// rebuilds make the page flicker.
			function applyFeed(data) {
				const key = data.map((h) => h.id).join()
				if (key === feedKey) return
				feedKey = key
				heads = data
				render()
			}

			// Live updates are pushed over a WebSocket by the server (full feed on
			// connect and after every capture). No polling.
			function connect() {
				const ws = new WebSocket(
					(location.protocol === 'https:' ? 'wss://' : 'ws://') +
						location.host +
						'/ws',
				)
				ws.onmessage = (e) => {
					try {
						const msg = JSON.parse(e.data)
						if (msg.type === 'feed' && Array.isArray(msg.heads)) {
							applyFeed(msg.heads)
						} else if (msg.type === 'ring') {
							// Real doorbell rang — same path as the on-screen button.
							// Dormant in the tablet demo (no ring messages arrive there).
							capture()
						}
					} catch (err) {
						console.error('ws message', err)
					}
				}
				ws.onclose = () =>
					setTimeout(connect, 2000 + Math.random() * 2000)
			}

			// One-time fallback in case the WebSocket can't connect.
			async function loadHeads() {
				try {
					const res = await fetch('/api/heads', { cache: 'no-store' })
					if (!res.ok) return
					const data = await res.json()
					if (Array.isArray(data) && !feedKey) applyFeed(data)
				} catch (err) {
					console.error('loadHeads', err)
				}
			}

			// ---- doorbell chime: two-tone ding-dong, synthesized ----
			function ding() {
				try {
					const ac = new (
						window.AudioContext || window.webkitAudioContext
					)()
					;[
						[659.25, 0],
						[523.25, 0.35],
					].forEach(([freq, at]) => {
						const osc = ac.createOscillator()
						const gain = ac.createGain()
						osc.type = 'sine'
						osc.frequency.value = freq
						gain.gain.setValueAtTime(0.35, ac.currentTime + at)
						gain.gain.exponentialRampToValueAtTime(
							0.001,
							ac.currentTime + at + 0.9,
						)
						osc.connect(gain).connect(ac.destination)
						osc.start(ac.currentTime + at)
						osc.stop(ac.currentTime + at + 1)
					})
				} catch {}
			}

			// ---- capture flow ----
			// Press → snap a frozen frame → the feed slides to the right half,
			// revealing the frozen shot + spinner on the left → upload → the
			// feed slides back over it. All motion is the one CSS transition
			// on #feed's transform.
			async function capture() {
				if (busy) return
				ding()
				const dataUrl = snapshot()

				// flash
				els.flash.classList.remove('go')
				void els.flash.offsetWidth
				els.flash.classList.add('go')

				busy = true
				els.capture.disabled = true
				els.capture.textContent = 'Ringing…'
				els.shot.src = dataUrl // freeze the moment being uploaded
				document.body.classList.add('busy') // feed slides aside
				pickHoldMsg()

				const opened = delay(MIN_OPEN_MS)
				try {
					const res = await fetch('/api/capture', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ image: dataUrl }),
					})
					const entry = await res.json()
					if (res.ok && entry && entry.id) {
						newestId = entry.id
						// WS broadcast usually beats this; applyFeed dedupes either way
						applyFeed([
							entry,
							...heads.filter((h) => h.id !== entry.id),
						])
					}
				} catch (err) {
					console.error('capture', err)
				} finally {
					await opened // never slam shut on a fast upload
					busy = false
					els.capture.disabled = false
					els.capture.textContent = 'Ring Doorbell'
					document.body.classList.remove('busy') // feed slides back
				}
			}

			els.capture.addEventListener('click', capture)

			initCam()
			connect()
			loadHeads()
		</script>
	</body>
</html>
